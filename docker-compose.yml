services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpx
      POSTGRES_USER: gpx
      POSTGRES_PASSWORD: gpx
    volumes: [gpx-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpx"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    environment:
      tile_urls: https://download.geofabrik.de/asia/indonesia/sumatra-latest.osm.pbf
      use_tiles_ignore_pbf: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      server_threads: "2"
    volumes: [gpx-valhalla:/custom_files]
    ports: ["8020:8002"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 30s
  api:
    build: ./backend
    restart: unless-stopped
    environment: &app-env
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://gpx:gpx@db:5432/gpx}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      UPLOAD_DIR: /data/uploads
    volumes: [gpx-uploads:/data/uploads]
    ports: ["8010:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.worker
    environment: *app-env
    volumes: [gpx-uploads:/data/uploads]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      valhalla: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args:
        VITE_MAP_STYLE_URL: ${MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/dark}
    restart: unless-stopped
    ports: ["3010:80"]
    depends_on: [api]
volumes:
  gpx-db:
  gpx-uploads:
  gpx-valhalla:
